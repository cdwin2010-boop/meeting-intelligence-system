<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>로그인</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600&display=swap">
<style>
body{margin:0;background:#000000}
:root{--mn-bg:#000000;--mn-surface:#0a0a0a;--mn-elev:#171717;--mn-border:#262626;--mn-accent:#ffffff;--mn-on-accent:#000000;--mn-text:#ededed;--mn-muted:#a1a1a1;--mn-blue:#0070f3;--mn-teal:#50e3c2;--mn-red:#ee0000;--mn-sans:'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;--mn-mono:'Geist Mono',ui-monospace,'D2Coding',monospace}
*{box-sizing:border-box}
a{color:inherit}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:none;box-shadow:0 0 0 1px #000000,0 0 0 3px #a3a3a3}
input::placeholder{color:#a1a1a1}
</style>

</head>
<body>

<div style="display:flex;align-items:center;justify-content:center;width:100%;min-height:900px;background:var(--mn-bg);color:var(--mn-text);font-family:var(--mn-sans);font-size:14px;line-height:20px"><form style="width:400px;display:flex;flex-direction:column;gap:24px"><div><div style="font-size:28px;line-height:36px;font-weight:600;letter-spacing:-0.03em">회의록 추적</div><p style="margin:8px 0 0;color:var(--mn-muted)">회의에서 정한 일을 놓치지 않게 추적합니다.</p></div><div style="background:var(--mn-surface);border:1px solid var(--mn-border);border-radius:8px;padding:24px;display:flex;flex-direction:column;gap:16px"><div style="display:flex;flex-direction:column;gap:8px"><label for="id" style="font-weight:500">아이디</label><input id="id" type="text" autocomplete="username" style="height:40px;width:100%;padding:0 12px;border-radius:6px;border:1px solid var(--mn-border);background:var(--mn-bg);color:var(--mn-text);font-family:inherit;font-size:14px;"></div><div style="display:flex;flex-direction:column;gap:8px"><label for="pw" style="font-weight:500">비밀번호</label><input id="pw" type="password" autocomplete="current-password" style="height:40px;width:100%;padding:0 12px;border-radius:6px;border:1px solid var(--mn-border);background:var(--mn-bg);color:var(--mn-text);font-family:inherit;font-size:14px;"></div><a href="02-home.html" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:6px;font-weight:500;font-family:inherit;text-decoration:none;cursor:pointer;white-space:nowrap;height:40px;padding:0 16px;font-size:14px;background:var(--mn-accent);color:var(--mn-on-accent);border:1px solid var(--mn-accent);width:100%">로그인</a><p style="margin:0;font-size:12px;color:var(--mn-muted)">계정은 소속 회사 관리자가 발급합니다. 비밀번호는 관리자에게 재설정을 요청하세요.</p></div></form></div>

</body>
</html>
